name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/app.js
      - run: node --check scripts/encrypt-family.mjs
      - run: node --check scripts/local-server.mjs
      - run: node --check scripts/validate-public-build.mjs
      - run: node --test api/test/*.test.mjs
